[package]
name = "libforma"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Core library of Forma: document model, vector engine, rendering and the .forma file format"
readme = "README.md"
keywords = ["graphics", "vector", "design", "svg", "2d"]
categories = ["graphics", "rendering"]

[features]
default = ["render", "pdf"]
# GPU rendering through Vello, and PNG export.
render = ["dep:vello", "dep:wgpu", "dep:pollster", "dep:image"]
# PDF export through krilla.
pdf = ["dep:krilla"]

[dependencies]
# Dependencies still in 0.x are pinned to an exact minor version and upgraded deliberately.
kurbo = "0.13.1"
parley = "0.12.0"
skrifa = "0.44.0"
linesweeper = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: coordinates must read back bit-for-bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4", "serde"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
blake3 = "1.8"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
png = "0.18.1"

# render
vello = { version = "0.11.0", optional = true }
wgpu = { version = "30.0", optional = true }
pollster = { version = "1.0", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

# pdf
krilla = { version = "0.8.2", optional = true }

[[example]]
name = "showcase"
required-features = ["render", "pdf"]

[dev-dependencies]
# Parses exported SVG in tests to check it is valid.
usvg = { version = "0.49.0", default-features = false }
